name: atomic_logger
description: Local-first location and photo logging engine with multiple app flavors
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Camera & Media
  camera: ^0.10.5+5
  image_picker: ^1.0.5

  # Utilities
  uuid: ^4.2.1
  intl: ^0.18.1
  permission_handler: ^11.1.0
  share_plus: ^7.2.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets will be added here as needed
  # assets:
  #   - assets/icons/

  # Flavor-specific app icons will be configured separately
